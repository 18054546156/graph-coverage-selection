name: pathmnist_ratio_sweep
datasets: [pathmnist]
methods: [random, graph_a2, herding, fps]
ratios: [0.01, 0.02, 0.05, 0.10]
selection_seed: 42
training_seeds: [42]
epochs: 1000
dynamics_epochs: 200
image_size: 224
dynamics_image_size: 28
batch_size: 256
num_workers: 4
embedding_source: uni
augment: false
download_medmnist: false
corruption_hash: false
method_config:
  facility:
    global_selection: false
  graph_a2:
    global_selection: true
    k_neighbors: 50
    k_hops: 2
    kernel: A_sym_plus_A_sym_squared
checkpoint_rule: final_epoch
